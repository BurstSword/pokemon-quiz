<ion-header class="ion-no-border">
  <ion-toolbar class="ion-no-border">
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/lobby']" expand="block" fill="clear" shape="round">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Adivina el desenfoque</ion-title>
    <ion-buttons slot="end">
      <ion-button expand="block" fill="clear" shape="round" (click)="disableTwoIncorrectOptions()">
        <ion-icon slot="icon-only" src="../../assets/icons/filter.svg"></ion-icon>
      </ion-button>
      <ion-button expand="block" fill="clear" shape="round" (click)="clarifyImage()">
        <ion-icon slot="icon-only" src="../../assets/icons/clues.svg"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="pageWrap">
    <div class="containerQuiz">
      <div class="imageSection">
        <img
          id="pokemon-image-blur"
          class="animate-img"
          [ngClass]="isRevealed ? '' : 'blurred' + blurState"
          [src]="pokemon.Image"
          [alt]="pokemon.Name"
          loading="lazy"
          decoding="async"
        />
      </div>

      <div class="typeRow" *ngIf="pokemonTypes">
        <img class="typeImage" [src]="getImageUrl(pokemon.Type1)" alt="{{pokemon.Type1}}">
        <img class="typeImage" *ngIf="pokemon.Type2" [src]="getImageUrl(pokemon.Type2)" alt="{{pokemon.Type2}}">
      </div>

      <div class="quizSection">
        <hr>
        <div class="heightCentered">
          <ion-grid>
            <ion-row>
              <ion-col *ngFor="let item of options; trackBy: trackByOption" class="textCentered" size="12">
                <ion-button
                  class="buttons"
                  [ngClass]="getOptionClass(item)"
                  [disabled]="optionsLocked || item.state === 'disabled'"
                  expand="block"
                  (click)="resolveOptions(item)"
                  size="large"
                  shape="round"
                >
                  <div class="optionContent nonClickable">
                    <div class="circle nonClickable">
                      <ion-icon class="iconPokeball nonClickable" src="../../assets/icons/pokeball-1.svg"></ion-icon>
                    </div>
                    <span class="optionText nonClickable">{{ item.Name }}</span>
                  </div>
                </ion-button>
              </ion-col>
            </ion-row>
          </ion-grid>
        </div>
      </div>
    </div>
  </div>
</ion-content>

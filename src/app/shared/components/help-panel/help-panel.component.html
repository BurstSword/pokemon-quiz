@if (open) {
  <div class="helpOverlay" (click)="closed.emit()">
    <aside class="helpPanel" role="dialog" aria-modal="true" [attr.aria-label]="title" (click)="$event.stopPropagation()">
      <header class="helpHeader">
        <div class="helpCopy">
          <span class="eyebrow">Como se juega</span>
          <h2>{{ title }}</h2>
          @if (description) {
            <p>{{ description }}</p>
          }
        </div>

        <button type="button" class="closeButton" (click)="closed.emit()" aria-label="Cerrar ayuda">
          <span aria-hidden="true">&times;</span>
        </button>
      </header>

      <div class="helpBody">
        <ng-content></ng-content>
      </div>
    </aside>
  </div>
}

<section class="sessionBar">
  <div class="copy">
    <p>{{ intro }}</p>
    @if (hintNote) {
      <span>{{ hintNote }}</span>
    }
  </div>

  <div class="meta">
    <span class="chip">Ultimo {{ lastScore }}</span>
    <span class="chip">Racha {{ currentStreak }}</span>
    <span class="chip">{{ bestLabel }} {{ bestValue }}</span>
  </div>
</section>

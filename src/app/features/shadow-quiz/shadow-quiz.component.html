<app-page-header title="Quiz sombra">
  <button
    type="button"
    header-actions
    class="headerIconButton textActionButton"
    (click)="openHelp()"
    aria-label="Ver ayuda del juego"
  >
    Ayuda
  </button>
</app-page-header>

<app-help-panel
  [open]="helpOpen"
  eyebrow="Como jugar"
  title="Quiz sombra"
  [description]="helpContent.howTo"
  (closed)="closeHelp()"
>
  <div class="helpSection">
    <strong>Pistas de ronda</strong>
    <p>{{ helpContent.hintSummary }}</p>
    <span class="helpNote">{{ helpContent.hintPenalty }}</span>
  </div>

  <button type="button" class="helpPrimaryAction pq-button pq-button--primary" (click)="acknowledgeHelp()">
    {{ onboardingPending ? 'Entendido' : 'Cerrar ayuda' }}
  </button>
</app-help-panel>

<main class="pageContent">
  <div class="pageWrap">
    <div class="containerQuiz">
      <app-game-score-bar mode="shadow"></app-game-score-bar>

      <section class="assistRow" *ngIf="!poolErrorMessage">
        <button type="button" class="assistButton pq-button pq-button--ghost pq-button--compact pq-button--pill" (click)="openHelp()">Como jugar</button>
        <button type="button" class="assistButton pq-button pq-button--secondary pq-button--compact pq-button--pill" (click)="useHelpToggleTypes()" [disabled]="!roundReady || optionsLocked">
          Pista: tipos
        </button>
        <button type="button" class="assistButton pq-button pq-button--danger pq-button--compact pq-button--pill" (click)="useHelpDisableOptions()" [disabled]="!roundReady || optionsLocked">
          Quitar 2
        </button>
      </section>

      <section class="poolErrorState" *ngIf="poolErrorMessage">
        <strong>No hay suficientes Pokemon activos</strong>
        <p>{{ poolErrorMessage }}</p>
      </section>

      <div class="imageSection">
        <div class="imageFrame">
          <div class="imageLoadingState" *ngIf="imageLoading">
            <app-skeleton-block class="imageSkeleton" [radius]="28"></app-skeleton-block>
          </div>

          <div class="imageErrorState" *ngIf="!imageLoading && imageError">
            <span>No pudimos cargar la silueta de esta ronda.</span>
          </div>

          <img
            *ngIf="!imageLoading && !imageError && displayImageSrc"
            id="pokemon-image-shadow"
            class="animate-img"
            [ngClass]="{ blackImage: !visible }"
            [src]="displayImageSrc"
            [alt]="getCurrentPokemonLabel()"
            loading="eager"
            decoding="async"
          />
        </div>
      </div>

      <div class="typeRow" *ngIf="roundReady && pokemonTypes && pokemon?.Type1">
        <img class="typeImage" [src]="getImageUrl(pokemon?.Type1 || '')" [alt]="pokemon?.Type1 || 'Type 1'" />
        <img
          class="typeImage"
          *ngIf="pokemon?.Type2"
          [src]="getImageUrl(pokemon?.Type2 || '')"
          [alt]="pokemon?.Type2 || 'Type 2'"
        />
      </div>

      <div class="quizSection">
        <div class="quizIntro">
          <span class="panelEyebrow">Opciones</span>
          <strong>{{ resultStatus ? 'Respuesta resuelta' : roundReady ? 'Elige el Pokemon correcto' : 'Preparando ronda' }}</strong>
        </div>
        <hr />
        <div class="heightCentered">
          <div class="optionsSkeleton" *ngIf="!roundReady">
            <app-skeleton-block
              *ngFor="let slot of loadingOptionSlots; trackBy: trackByIndex"
              class="optionSkeleton"
              [radius]="18"
            ></app-skeleton-block>
          </div>

          <div class="optionsList" *ngIf="roundReady">
            <button
              *ngFor="let item of options; trackBy: trackByOption"
              type="button"
              class="buttons"
              [ngClass]="getOptionClass(item)"
              [disabled]="optionsLocked || item.state === 'disabled'"
              (click)="resolveOption(item)"
            >
              <span class="optionContent">
                <span class="circle">
                  <img class="iconPokeball" src="assets/icons/pokeball-1.svg" alt="" />
                </span>
                <span class="optionText">{{ getOptionLabel(item) }}</span>
              </span>
            </button>
          </div>
        </div>

        <app-result-banner
          [status]="resultStatus"
          [title]="resultTitle"
          [message]="resultMessage"
          [answer]="revealedAnswer"
          [points]="resultPoints"
          [streakText]="resultStreakText"
          [recordText]="resultRecordText"
          (next)="nextRound()"
        ></app-result-banner>
      </div>
    </div>
  </div>
</main>

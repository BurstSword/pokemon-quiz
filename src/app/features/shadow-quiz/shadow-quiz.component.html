<app-page-header title="Quiz sombra">
  <button type="button" header-actions class="headerIconButton textIcon" (click)="toggleHelp()" aria-label="Abrir ayuda">
    <span aria-hidden="true">?</span>
  </button>
</app-page-header>

<app-help-panel
  [open]="helpOpen"
  title="Cómo se juega"
  description="Mira la silueta, activa una pista si la necesitas y responde una sola vez por ronda."
  (closed)="closeHelp()"
>
  <button type="button" class="helpButton" (click)="useHelpDisableOptions()" [disabled]="!roundReady || optionsLocked">
    <img src="assets/icons/remove-options.svg" alt="" />
    Quitar dos opciones
  </button>

  <button type="button" class="helpButton" (click)="useHelpToggleTypes()" [disabled]="!roundReady || optionsLocked">
    <img src="assets/icons/clues.svg" alt="" />
    Mostrar u ocultar tipos
  </button>
</app-help-panel>

<main class="pageContent">
  <div class="pageWrap">
    <div class="containerQuiz">
      <section class="poolErrorState" *ngIf="poolErrorMessage">
        <strong>No hay suficientes Pokémon activos</strong>
        <p>{{ poolErrorMessage }}</p>
      </section>

      <div class="imageSection">
        <div class="imageFrame">
          <div class="imageLoadingState" *ngIf="imageLoading">
            <app-skeleton-block class="imageSkeleton" [radius]="28"></app-skeleton-block>
          </div>

          <div class="imageErrorState" *ngIf="!imageLoading && imageError">
            <span>No pudimos cargar la silueta de esta ronda.</span>
          </div>

          <img
            *ngIf="!imageLoading && !imageError && displayImageSrc"
            id="pokemon-image-shadow"
            class="animate-img"
            [ngClass]="{ blackImage: !visible }"
            [src]="displayImageSrc"
            [alt]="getPokemonLabel()"
            loading="eager"
            decoding="async"
          />
        </div>
      </div>

      <div class="typeRow" *ngIf="roundReady && pokemonTypes && pokemon?.Type1">
        <img class="typeImage" [src]="getImageUrl(pokemon?.Type1 || '')" [alt]="pokemon?.Type1 || 'Type 1'" />
        <img
          class="typeImage"
          *ngIf="pokemon?.Type2"
          [src]="getImageUrl(pokemon?.Type2 || '')"
          [alt]="pokemon?.Type2 || 'Type 2'"
        />
      </div>

      <div class="quizSection">
        <div class="quizIntro">
          <span class="panelEyebrow">Opciones</span>
          <strong>{{ resultStatus ? 'Respuesta resuelta' : roundReady ? 'Elige el Pokémon correcto' : 'Preparando ronda' }}</strong>
        </div>
        <hr />
        <div class="heightCentered">
          <div class="optionsSkeleton" *ngIf="!roundReady">
            <app-skeleton-block
              *ngFor="let slot of loadingOptionSlots; trackBy: trackByIndex"
              class="optionSkeleton"
              [radius]="18"
            ></app-skeleton-block>
          </div>

          <div class="optionsList" *ngIf="roundReady">
            <button
              *ngFor="let item of options; trackBy: trackByOption"
              type="button"
              class="buttons"
              [ngClass]="getOptionClass(item)"
              [disabled]="optionsLocked || item.state === 'disabled'"
              (click)="resolveOption(item)"
            >
              <span class="optionContent">
                <span class="circle">
                  <img class="iconPokeball" src="assets/icons/pokeball-1.svg" alt="" />
                </span>
                <span class="optionText">{{ item.Label || item.Name }}</span>
              </span>
            </button>
          </div>
        </div>

        <app-result-banner
          [status]="resultStatus"
          [title]="resultTitle"
          [message]="resultMessage"
          [answer]="revealedAnswer"
          (next)="nextRound()"
        ></app-result-banner>
      </div>
    </div>
  </div>
</main>
